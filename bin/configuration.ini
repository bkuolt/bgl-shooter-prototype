;********************************************************************************
;********************************************************************************
;**                                                                            **
;**                         BGL Configuration                                  **
;**                                                                            **
;********************************************************************************
;********************************************************************************


[BGL]
;================================================================================
;=                                                                              =
;=                               Display & Resolution                           =
;=                                                                              =
;================================================================================
;= ResolutionX, ResolutionY: Screen resolution (-1 selects the optimal desktop resolution)
;= Windowed : Windowed mode (0) or Fullscreen mode (1)
;================================================================================
Windowed    =  0
ResolutionX = 1920
ResolutionY = 1080

;================================================================================
;=                                                                              =
;=                               Textures & Graphics                            =
;=                                                                              =
;================================================================================
;      Gamma: Gamma correction multiplier
;   Textures: Enable texturing [Yes(1) or No(0)]
; HDTextures: Use high-definition textures [Yes(1) or No(0)]
;         AF: Anisotropic filtering level (e.g. 2, 4, 8, 16)
;================================================================================
Gamma      = 1.5
Textures   = 1
HDTextures = 1
AF         = 8

;================================================================================
;=                                                                              =
;=                           Skybox & Environmental Effects                     =
;=                                                                              =
;================================================================================
;        Skybox: Render skybox [Yes(1) or No(0)]
; AnimateSkybox: Animate skybox movement [Yes(1) or No(0)]
; AnimateWater:  Animate water surfaces [Yes(1) or No(0)]
;================================================================================
Water         = 1
Skybox        = 1
AnimateSkybox = 1
AnimateWater  = 1

;================================================================================
;=                                                                              =
;=                                  Audio                                       =
;=                                                                              =
;================================================================================
; Audio: Play music and sound effects [Yes(1) or No(0)]
;================================================================================
Audio  = 1


;********************************************************************************
;*                                                                              *
;*                           Camera & Game Data Settings                        *
;*                                                                              *
;********************************************************************************
; Data
DataFolder = local
Level      = base2

; Movement & Controls
Rotation    = 0
Translation = 0
Up          = 0

; Camera Position & Orientation
PositionX = 500
PositionY = 500
PositionZ = 100
RotationX = 0
RotationY = 180
RotationZ = 0
